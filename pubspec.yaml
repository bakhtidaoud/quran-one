name: quran_one
description: Quran One - Quran, prayer and memorisation.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.7.0
  flutter: ^3.29.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, DI, routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2

  # Data / persistence
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.26
  drift_flutter: ^0.2.4
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.3
  path_provider: ^2.1.5

  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Audio
  just_audio: ^0.9.42
  audio_service: ^0.18.16
  audio_session: ^0.1.22

  # Device
  geolocator: ^13.0.2
  flutter_compass: ^0.8.1
  permission_handler: ^11.3.1
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2
  wakelock_plus: ^1.2.10

  # Notifications / background
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  workmanager: ^0.5.2

  # Billing
  in_app_purchase: ^3.2.0

  # UI
  dynamic_color: ^1.7.0
  flutter_svg: ^2.0.16
  material_symbols_icons: ^4.2801.0
  animations: ^2.0.11

  # Observability
  logger: ^2.5.0

  # Utility
  collection: ^1.19.0
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.23.0

  very_good_analysis: ^6.0.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

  mocktail: ^1.0.4
  fake_async: ^1.3.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/data/

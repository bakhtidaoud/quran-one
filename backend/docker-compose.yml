name: quran-one

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: quran
      POSTGRES_DB: quran_one
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quran"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://quran:quran@db:5432/quran_one
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      DJANGO_SECRET_KEY: dev-only-not-a-real-secret
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    # Four queues on one worker locally; separate deployments in production,
    # because a content-pack build must never delay an Athan notification.
    command: celery -A config worker -Q notifications,content,billing,default -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://quran:quran@db:5432/quran_one
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      DJANGO_SECRET_KEY: dev-only-not-a-real-secret
    volumes:
      - .:/app
    depends_on:
      - api

  beat:
    build: .
    command: celery -A config beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://quran:quran@db:5432/quran_one
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      DJANGO_SECRET_KEY: dev-only-not-a-real-secret
    volumes:
      - .:/app
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
